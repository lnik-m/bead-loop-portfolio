name: PR CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
      - name: Install Bun
        run: curl https://bun.sh/install | sh

      - name: Add Bun to PATH
        with:
          node-version: '16'
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          bun install

      - name: Lint check
        run: |
          bun lint

      - name: Run tests
        run: |
          bun test

      - name: Build
        run: |
          bun build
